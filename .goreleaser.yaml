version: 2

project_name: snitchx

before:
  hooks:
    - go mod tidy

builds:
  - id: linux
    binary: snitchx
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ldflags:
      - -s -w
      - -X github.com/ahzslanh/snitchx/cmd.Version={{.Version}}
      - -X github.com/ahzslanh/snitchx/cmd.Commit={{.ShortCommit}}
      - -X github.com/ahzslanh/snitchx/cmd.Date={{.Date}}

  - id: windows
    binary: snitchx
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/ahzslanh/snitchx/cmd.Version={{.Version}}
      - -X github.com/ahzslanh/snitchx/cmd.Commit={{.ShortCommit}}
      - -X github.com/ahzslanh/snitchx/cmd.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

nfpms:
  - id: packages
    ids:
      - linux
    package_name: snitchx
    vendor: snitchX
    homepage: https://github.com/ahzslanh/snitchx
    maintainer: snitchX contributors
    description: "cross-platform security inspection: network, processes, services, compliance"
    license: MIT
    formats:
      - deb
      - rpm
      - apk

release:
  github:
    owner: ahzslanh
    name: snitchx
  draft: false
  prerelease: auto
