version: 2

project_name: snitchx

builds:
  - id: darwin
    binary: snitchx
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/ahzslanh/snitchx/cmd.Version={{.Version}}
      - -X github.com/ahzslanh/snitchx/cmd.Commit={{.ShortCommit}}
      - -X github.com/ahzslanh/snitchx/cmd.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - README.md

release:
  github:
    owner: ahzslanh
    name: snitchx
  draft: false
  prerelease: auto
  mode: append
